<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobius Club — ตลาดกลางซื้อขายปลอดภัยด้วย Escrow</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --gold: #d97706;
    --gold-bg: #fffbeb;
    --gold-border: #fde68a;
    --green: #059669;
    --green-bg: #ecfdf5;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Prompt', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }

  /* แถบควบคุมการทดสอบด้านบนสุดที่เดียว */
  .role-bar {
    background: #0f172a;
    color: #fff;
    padding: 8px 16px;
    position: sticky;
    top: 0;
    z-index: 60;
  }
  .role-bar-inner {
    max-width: 1180px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .role-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .role-tab {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: #e2e8f0;
    transition: .15s;
  }
  .role-tab:hover { background: #334155; }
  .role-tab.active {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    border-color: transparent;
  }
  .notify-dot {
    background: #ef4444;
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 99px;
    margin-left: 4px;
  }
  .floating-role-toggle {
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 90;
    background: #0f172a;
    color: #fbbf24;
    border: 1px solid #fbbf24;
    padding: 5px 12px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Header หลักของเว็บ */
  header { background: #fff; border-bottom: 1px solid var(--border); }
  .header-inner {
    max-width: 1180px;
    margin: auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .logo-circle {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--gold-bg);
    border: 1px solid var(--gold-border);
    display: flex; align-items: center; justify-content: center;
  }
  .brand h1 { font-size: 19px; font-weight: 700; }
  .brand small { color: var(--muted); font-size: 11px; display: block; }
  .menu-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ปุ่มทั่วไป */
  .btn {
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text);
    transition: .15s;
  }
  .btn:hover { background: #f1f5f9; }
  .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; }
  .btn-gold:hover { opacity: .92; }
  .btn-green { background: var(--green); color: #fff; border: none; }
  .btn-red { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
  .btn-blue { background: var(--blue-bg); color: var(--blue); border-color: #bfdbfe; }

  main { max-width: 1180px; margin: 16px auto 50px; padding: 0 16px; }

  /* แถบสรุปผู้ซื้อ + โปรโมชั่น (สั้นกระชับในแถบเดียว) */
  .buyer-compact-bar {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .buyer-info-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .promo-mini {
    background: var(--gold-bg);
    border: 1px solid var(--gold-border);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .mini-progress {
    width: 90px;
    height: 8px;
    background: #fff;
    border: 1px solid #fcd34d;
    border-radius: 99px;
    overflow: hidden;
  }
  .mini-progress-fill {
    height: 100%;
    background: var(--green);
  }

  /* แถบค้นหาและหมวดหมู่แบบกระชับ */
  .filter-bar {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .search-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .search-input-wrap { flex: 1; min-width: 220px; position: relative; }
  .search-input-wrap input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 13px;
    background: #f8fafc;
  }
  .search-input-wrap span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; }
  .cat-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-pill {
    padding: 5px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: #f8fafc;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .cat-pill.active { background: var(--gold); color: #fff; border-color: var(--gold); }

  /* การ์ดสินค้าแบบสั้นกระชับ เข้าใจง่าย */
  .grid-products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }
  .p-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: .15s;
  }
  .p-card:hover { border-color: #fcd34d; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
  .p-img {
    height: 96px;
    background: linear-gradient(135deg, #fffbeb, #f1f5f9);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    position: relative;
  }
  .p-cat {
    position: absolute; top: 6px; left: 6px;
    background: #fff; border: 1px solid var(--border);
    font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 600;
  }
  .p-type-badge {
    position: absolute; bottom: 6px; right: 6px;
    background: #0f172a; color: #fbbf24;
    font-size: 10px; padding: 2px 8px; border-radius: 99px; font-weight: 600;
  }
  .p-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
  .p-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; line-height: 1.35; }
  .p-shop-row {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .shop-link { color: var(--blue); text-decoration: underline; cursor: pointer; font-weight: 600; }
  .p-price-row {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .p-price { font-size: 18px; font-weight: 700; color: var(--gold); }
  .p-actions { display: flex; gap: 6px; }
  .p-actions .btn { flex: 1; justify-content: center; padding: 7px 8px; font-size: 12px; }

  /* กล่องเนื้อหา */
  .box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .box-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media(max-width: 820px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

  .stat-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: #fff; }
  .stat-box.highlight { background: var(--green-bg); border-color: #a7f3d0; }
  .stat-box.clickable { cursor: pointer; }
  .stat-box small { color: var(--muted); font-size: 12px; display: block; }
  .stat-box .num { font-size: 22px; font-weight: 700; margin-top: 2px; }

  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 11px; border: 1px solid var(--border);
    border-radius: 8px; font-family: inherit; font-size: 13px; background: #fff;
  }

  .secret-code-box {
    background: #0f172a; color: #fbbf24; border-radius: 8px; padding: 8px 12px;
    font-family: monospace; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px;
  }

  .doc-upload-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 8px; background: #f8fafc;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .doc-upload-card.has-file { background: #fffbeb; border-color: #fcd34d; }
  .doc-preview-thumb { width: 50px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }

  .alert { padding: 10px 12px; border-radius: 9px; font-size: 12px; margin-bottom: 10px; font-weight: 500; }
  .alert-ok { background: var(--green-bg); color: var(--green); border: 1px solid #a7f3d0; }
  .alert-warn { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 9px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  th { background: #f8fafc; color: var(--muted); font-weight: 600; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .b-gold { background: var(--gold-bg); color: var(--gold); }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-red { background: var(--red-bg); color: var(--red); }

  /* แชท */
  .chat-box { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .chat-top {
    background: #fffbeb; padding: 10px 14px; border-bottom: 1px solid var(--gold-border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .chat-messages {
    height: 230px; overflow-y: auto; padding: 12px; background: #f8fafc;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 75%; padding: 7px 11px; border-radius: 9px; background: #fff; border: 1px solid var(--border); font-size: 13px; align-self: flex-start; }
  .msg.me { align-self: flex-end; background: var(--gold-bg); border-color: var(--gold-border); }
  .msg.sys { align-self: center; background: var(--green-bg); color: var(--green); border-color: #a7f3d0; font-weight: 600; }
  .chat-bar { padding: 8px; background: #fff; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }

  .pay-method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pay-option { border: 2px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; }
  .pay-option.active { border-color: var(--gold); background: var(--gold-bg); }
  .credit-card-form { background: #0f172a; color: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
  .credit-card-form label { color: #cbd5e1; font-size: 11px; }
  .credit-card-form input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff; }

  .review-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #f8fafc; font-size: 13px; }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,0.55);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-card {
    background: #fff; border-radius: 14px; max-width: 460px; width: 100%;
    padding: 20px; position: relative; max-height: 92vh; overflow-y: auto;
  }
  .modal-card.wide { max-width: 760px; }
  .close-x { position: absolute; top: 10px; right: 12px; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--muted); }
  .doc-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  @media(max-width: 680px) { .doc-gallery { grid-template-columns: 1fr; } }
  .doc-item { border: 1px solid var(--border); border-radius: 10px; padding: 8px; background: #f8fafc; text-align: center; }
  .doc-item img { width: 100%; height: 140px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--border); margin: 4px 0; }
  #toast {
    position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff;
    padding: 10px 16px; border-radius: 9px; font-size: 13px; display: none; z-index: 200;
  }
</style>
</head>
<body>

<!-- ปุ่มเปิดแถบสลับบทบาทเมื่อถูกซ่อน -->
<button id="showRoleBarBtn" class="floating-role-toggle" style="display:none;" onclick="toggleRoleBar(false)">
  👁️ แสดงแถบสลับบทบาท
</button>

<!-- แถบควบคุมการทดสอบ (รวมทุกปุ่มทดสอบไว้ข้างบนสุดที่เดียว ไม่มีปะปนในหน้าเว็บด้านใน) -->
<div class="role-bar" id="topRoleBar">
  <div class="role-bar-inner">
    <div style="font-size:12px; color:#cbd5e1;">
      🛠️ <b>เมนูสลับบทบาท (สำหรับทดสอบ):</b>
    </div>
    <div class="role-tabs">
      <button class="role-tab" id="tab-guest" onclick="setRole('guest')">👀 ยังไม่ล็อกอิน</button>
      <button class="role-tab" id="tab-buyer" onclick="setRole('buyer')">🛒 ผู้ซื้อ</button>
      <button class="role-tab" id="tab-seller" onclick="setRole('seller')">🏪 ผู้ขาย</button>
      <button class="role-tab" id="tab-admin" onclick="setRole('admin')">
        👑 แอดมิน (5%) <span id="adminBadge" class="notify-dot" style="display:none;">0</span>
      </button>
      <button class="role-tab" onclick="simulatePromoStep()">⚡ +1 แต้มโปร</button>
      <button class="role-tab" onclick="resetAllData()">🔄 รีเซ็ต</button>
      <button class="role-tab" onclick="toggleRoleBar(true)">🙈 ซ่อนแถบบน</button>
    </div>
  </div>
</div>

<!-- Header เว็บไซต์จริง -->
<header>
  <div class="header-inner">
    <div class="brand" onclick="goPage('market')">
      <div class="logo-circle">
        <svg viewBox="0 0 100 60" width="30" height="20">
          <defs>
            <linearGradient id="gMob" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
          </defs>
          <path d="M50 30 C38 8 10 8 10 30 C10 52 38 52 50 30 C62 8 90 8 90 30 C90 52 62 52 50 30 Z"
                fill="none" stroke="url(#gMob)" stroke-width="11" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Mobius Club</h1>
        <small>ตลาดกลางซื้อขายปลอดภัยด้วยระบบ Escrow</small>
      </div>
    </div>

    <div class="menu-row" id="headerMenu"></div>
  </div>
</header>

<main id="appMain"></main>

<!-- Modal 1: ล็อกอินด้วยอีเมลและรหัสผ่าน -->
<div class="modal-bg" id="modalGmail">
  <div class="modal-card">
    <button class="close-x" onclick="hideModal('modalGmail')">✕</button>
    <div style="text-align:center; margin-bottom:12px;">
      <div style="font-size:32px;">🔐</div>
      <h3>เข้าสู่ระบบด้วยอีเมลและรหัสผ่าน</h3>
    </div>
    <div class="field">
      <label>ชื่อผู้ใช้งาน</label>
      <input type="text" id="inputBuyerName" value="Non_Gamer_TH">
    </div>
    <div class="field">
      <label>อีเมล *</label>
      <input type="email" id="inputGmail" value="non.gamer@gmail.com">
    </div>
    <div class="field">
      <label>รหัสผ่าน *</label>
      <input type="password" id="inputPassword" value="12345678">
    </div>
    <button class="btn btn-gold" style="width:100%; justify-content:center; padding:10px;" onclick="loginWithEmailPassword()">
      ✅ เข้าสู่ระบบ
    </button>
  </div>
</div>

<!-- Modal 2: เติมเงิน (QR / บัตรเครดิต) -->
<div class="modal-bg" id="modalQR">
  <div class="modal-card">
    <button class="close-x" onclick="hideModal('modalQR')">✕</button>
    <h3 style="margin-bottom:10px;">💳 เติมเงินเข้ากระเป๋า</h3>

    <div class="pay-method-grid">
      <div class="pay-option active" id="topupTabQR" onclick="switchTopupMethod('qr')">
        <b>📲 สแกน QR Code</b>
      </div>
      <div class="pay-option" id="topupTabCard" onclick="switchTopupMethod('card')">
        <b>💳 บัตรเครดิต / เดบิต</b>
      </div>
    </div>

    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <button class="btn" style="flex:1;justify-content:center;" onclick="setQRValue(1000)">฿1,000</button>
      <button class="btn" style="flex:1;justify-content:center;" onclick="setQRValue(3000)">฿3,000</button>
      <button class="btn" style="flex:1;justify-content:center;" onclick="setQRValue(5000)">฿5,000</button>
    </div>
    <div class="field">
      <input type="number" id="qrAmount" value="1000" oninput="renderQRBox()">
    </div>

    <div id="topupSectionQR" style="text-align:center; background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px;">
      <b style="color:#1e3a8a; font-size:12px;">THAI QR PROMPTPAY</b>
      <div id="qrSvgWrap" style="margin:6px auto; display:flex; justify-content:center;"></div>
      <div>ยอดเติม: <b style="color:var(--gold); font-size:16px;" id="qrTextAmt">฿1,000</b></div>
    </div>

    <div id="topupSectionCard" style="display:none;">
      <div class="credit-card-form">
        <div class="field">
          <label>หมายเลขบัตรเครดิต 16 หลัก</label>
          <input type="text" id="topupCardNo" value="4532 •••• •••• 8899">
        </div>
        <div class="grid-2">
          <div class="field">
            <label>วันหมดอายุ (MM/YY)</label>
            <input type="text" id="topupCardExp" value="08/29">
          </div>
          <div class="field">
            <label>CVV</label>
            <input type="password" id="topupCardCvv" value="888">
          </div>
        </div>
      </div>
    </div>

    <button class="btn btn-gold" style="width:100%; justify-content:center; padding:10px;" onclick="confirmQRTopup()">
      ✅ ยืนยันการเติมเงิน
    </button>
  </div>
</div>

<!-- Modal 3: ยืนยันก่อนสั่งซื้อ -->
<div class="modal-bg" id="modalCheckoutConfirm">
  <div class="modal-card">
    <button class="close-x" onclick="hideModal('modalCheckoutConfirm')">✕</button>
    <div id="modalCheckoutConfirmContent"></div>
  </div>

const fmt = n => '฿' + Number(n || 0).toLocaleString('th-TH');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.style.display = 'none', 3000);
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  toast(`คัดลอก "${text}" แล้ว`);
}

  db.hideRoleBar = hide;

  document.getElementById('topRoleBar').style.display = hide ? 'none' : 'block';

}

function setRole(role) {
  db.role = role;
  if (role === 'guest' || role === 'buyer') db.page = 'market';
  if (role === 'seller') db.page = 'seller';
  if (role === 'admin') db.page = 'admin';
  saveDB();
  render();
}

function goPage(p) {
  db.page = p;
  saveDB();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openShopProfile(shopName) {
  db.viewingShopName = shopName;
  goPage('shop_profile');
}

function render() {
  toggleRoleBar(!!db.hideRoleBar);

  ['guest','buyer','seller','admin'].forEach(r => {
    const el = document.getElementById('tab-' + r);
    if (el) el.className = 'role-tab' + (r === db.role ? ' active' : '');
  });

  const pendingCount = (db.currentSeller.status === 'pending' ? 1 : 0) + db.orders.length;
  const badge = document.getElementById('adminBadge');
  if (badge) {
    badge.style.display = pendingCount > 0 ? 'inline-block' : 'none';
    badge.textContent = pendingCount;
  }

  renderHeader();
  const main = document.getElementById('appMain');
  if (db.page === 'market') main.innerHTML = renderMarket();
  else if (db.page === 'chat') main.innerHTML = renderChat();
  else if (db.page === 'orders') main.innerHTML = renderOrders();
  else if (db.page === 'seller') main.innerHTML = renderSeller();
  else if (db.page === 'admin') main.innerHTML = renderAdmin();
  else if (db.page === 'shop_profile') main.innerHTML = renderShopProfile();
}

function getShopReviewSummary(shopName) {
  const list = db.reviews.filter(r => r.sellerShop === shopName);
  if (list.length === 0) return { avg: '5.0', count: 0 };
  const avg = (list.reduce((s, x) => s + x.rating, 0) / list.length).toFixed(1);
  return { avg, count: list.length };
}

function onSearchInput(val) {
  db.searchQuery = val;
  saveDB();
  const wrap = document.getElementById('marketProductsWrapper');
  if (wrap) wrap.innerHTML = renderFilteredProductsHTML();
}

  db.selectedCategory = cat;
  saveDB();
  render();
}

function selectTypeFilter(typeVal) {
  db.selectedTypeFilter = typeVal;
  saveDB();

}

function getFilteredProducts() {
  const q = (db.searchQuery || '').trim().toLowerCase();
  const cat = db.selectedCategory || 'ทั้งหมด';
  const tFilter = db.selectedTypeFilter || 'all';

  return db.products.filter(p => {
    const matchCat = cat === 'ทั้งหมด' || p.cat === cat;
    const matchType = tFilter === 'all' || p.deliveryType === tFilter;
    const matchQuery = !q || (p.title + ' ' + p.cat + ' ' + p.sellerShop).toLowerCase().includes(q);
    return matchCat && matchType && matchQuery;
  });
}

/* ==================== ยืนยันก่อนสั่งซื้อ + ใช้คูปองลด 10% ==================== */
let checkoutPayMethod = 'wallet';
let usePromoCoupon10 = false;

function openCheckoutConfirm(productId) {
  if (db.role === 'guest') {
    toast('กรุณาเข้าสู่ระบบก่อนสั่งซื้อ');
    showModal('modalGmail');
    return;
  }
  const p = db.products.find(x => x.id === productId);
  if (!p) return;
  checkoutPayMethod = 'wallet';
  usePromoCoupon10 = (db.buyer.discountCoupons10 > 0 && p.price <= 2000);
  renderCheckoutConfirmModal(p);
  showModal('modalCheckoutConfirm');
}

function selectCheckoutPayMethod(method, productId) {
  checkoutPayMethod = method;
  const p = db.products.find(x => x.id === productId);
  if (p) renderCheckoutConfirmModal(p);
}

function togglePromoCoupon(checked, productId) {
  usePromoCoupon10 = checked;
  const p = db.products.find(x => x.id === productId);
  if (p) renderCheckoutConfirmModal(p);
}

function renderCheckoutConfirmModal(p) {
  const tInfo = DELIVERY_TYPES[p.deliveryType || 'account'] || DELIVERY_TYPES.account;
  const couponsAvailable = db.buyer.discountCoupons10 || 0;
  const canApplyCoupon = couponsAvailable > 0 && p.price <= 2000;
  const discountAmt = (canApplyCoupon && usePromoCoupon10) ? Math.round(p.price * 0.10) : 0;
  const finalPayPrice = p.price - discountAmt;

  document.getElementById('modalCheckoutConfirmContent').innerHTML = `
    <h3 style="margin-bottom:8px;">🛡️ ยืนยันการสั่งซื้อ</h3>

    <div class="box" style="background:#f8fafc; padding:12px; margin-bottom:12px;">
      <b>${p.icon || tInfo.icon} ${p.title}</b>
      <div style="font-size:12px; color:var(--muted); margin-top:2px;">
        ร้าน: ${p.sellerShop} · ${tInfo.label}
      </div>
      <div style="font-size:18px; font-weight:700; color:var(--gold); margin-top:6px;">
        ยอดชำระ: ${fmt(finalPayPrice)}
        ${discountAmt > 0 ? `<small style="color:var(--green); font-size:12px;">(ลด 10% = -${fmt(discountAmt)})</small>` : ''}
      </div>
    </div>

    ${canApplyCoupon ? `
      <label style="display:flex; align-items:center; justify-content:space-between; background:#ecfdf5; border:1px solid #10b981; padding:8px 12px; border-radius:9px; cursor:pointer; font-size:12.5px; margin-bottom:10px;">
        <span>🎟️ ใช้คูปองลด 10% (สำหรับสินค้าไม่เกิน 2,000฿)</span>
        <input type="checkbox" ${usePromoCoupon10 ? 'checked' : ''} onchange="togglePromoCoupon(this.checked, '${p.id}')" style="width:16px; height:16px;">
      </label>
    ` : ''}

    <div class="pay-method-grid">
      <div class="pay-option ${checkoutPayMethod === 'wallet' ? 'active' : ''}" onclick="selectCheckoutPayMethod('wallet', '${p.id}')">
        <b>📲 กระเป๋า Wallet</b>
        <div style="font-size:11px; color:var(--green);">มีอยู่ ${fmt(db.buyer.wallet)}</div>
      </div>
      <div class="pay-option ${checkoutPayMethod === 'credit_card' ? 'active' : ''}" onclick="selectCheckoutPayMethod('credit_card', '${p.id}')">
        <b>💳 บัตรเครดิต</b>
        <div style="font-size:11px; color:var(--muted);">Visa / MasterCard</div>
      </div>
    </div>

    ${checkoutPayMethod === 'credit_card' ? `
      <div class="credit-card-form">
        <div class="field">
          <label>หมายเลขบัตรเครดิต 16 หลัก</label>
          <input type="text" id="chkCardNo" value="4532 8891 2204 8899">
        </div>
        <div class="grid-2">
          <div class="field"><label>วันหมดอายุ</label><input type="text" id="chkCardExp" value="09/29"></div>
          <div class="field"><label>CVV</label><input type="password" id="chkCardCvv" value="789"></div>
        </div>
      </div>
    ` : ''}

    <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:12px; cursor:pointer;">
      <input type="checkbox" id="confirmOrderCheckbox" checked style="width:16px; height:16px;">
      <span>ยืนยันการสั่งซื้อสินค้านี้</span>
    </label>

    <div style="display:flex; gap:8px;">
      <button class="btn" style="flex:1; justify-content:center;" onclick="hideModal('modalCheckoutConfirm')">ยกเลิก</button>
      <button class="btn btn-gold" style="flex:2; justify-content:center;" onclick="executeConfirmedPurchase('${p.id}')">
        ✅ ชำระเงิน ${fmt(finalPayPrice)}
      </button>
    </div>
  `;
}

function executeConfirmedPurchase(productId) {
  if (!document.getElementById('confirmOrderCheckbox')?.checked) {
    toast('กรุณาติ๊กยืนยันก่อนสั่งซื้อ');
    return;
  }
  const p = db.products.find(x => x.id === productId);
  if (!p) return;

  const canApplyCoupon = (db.buyer.discountCoupons10 > 0) && (p.price <= 2000) && usePromoCoupon10;
  const discountAmt = canApplyCoupon ? Math.round(p.price * 0.10) : 0;
  const finalPayPrice = p.price - discountAmt;

  let payLabel = 'Mobius Wallet';
  if (checkoutPayMethod === 'wallet') {
    if (db.buyer.wallet < finalPayPrice) {
      hideModal('modalCheckoutConfirm');
      toast('ยอดเงินในกระเป๋าไม่พอ กรุณาเติมเงิน');
      setQRValue(finalPayPrice - db.buyer.wallet);
      openQRModal();
      return;
    }
    db.buyer.wallet -= finalPayPrice;
  } else {
    const cardNo = (document.getElementById('chkCardNo')?.value || '').trim();
    payLabel = 'บัตรเครดิต (••' + cardNo.slice(-4) + ')';
  }

  if (canApplyCoupon) {
    db.buyer.discountCoupons10 = Math.max(0, db.buyer.discountCoupons10 - 1);
  }

  let earnedNewCoupon = false;
  if (p.price >= 1000) {
    db.buyer.promoCount1000 = (db.buyer.promoCount1000 || 0) + 1;
    if (db.buyer.promoCount1000 >= 10) {
      db.buyer.promoCount1000 -= 10;
      db.buyer.discountCoupons10 = (db.buyer.discountCoupons10 || 0) + 1;
      earnedNewCoupon = true;
    }
  }

  const fee5 = Math.round(finalPayPrice * FEE_RATE);
  const net95 = finalPayPrice - fee5;
  db.admin.escrowHolding += finalPayPrice;

  const newOrder = {
    id: 'ORD-' + Math.floor(100 + Math.random() * 900),
    productId: p.id,
    sellerId: p.sellerId || 'seller_main',
    title: p.title,
    deliveryType: p.deliveryType || 'account',
    secretPayload: p.secretPayload || 'CODE-XXXX-9999',
    buyerName: db.buyer.name,
    sellerShop: p.sellerShop,
    sellerOwner: p.sellerOwner,
    price: finalPayPrice,
    fee5: fee5,
    sellerNet95: net95,
    payMethod: payLabel,
    status: 'held',
    reviewed: false
  };

  db.orders.unshift(newOrder);
  saveDB();
  hideModal('modalCheckoutConfirm');
  showDeliveredSecretModal(newOrder, earnedNewCoupon);
  render();
}

function showDeliveredSecretModal(order, earnedNewCoupon = false) {
  const tInfo = DELIVERY_TYPES[order.deliveryType || 'account'] || DELIVERY_TYPES.account;
  document.getElementById('modalDeliveredSecretContent').innerHTML = `
    <div style="text-align:center; margin-bottom:12px;">
      <div style="font-size:42px;">🎉</div>
      <h3 style="color:var(--green);">สั่งซื้อสำเร็จ!</h3>
      <small style="color:var(--muted);">${order.title}</small>

    ${earnedNewCoupon ? `<div class="alert alert-ok">🎁 สะสมครบ 10 ชิ้น! ได้รับคูปองลด 10% เพิ่ม 1 ใบ</div>` : ''}

    <div class="box" style="background:#fffbeb; border-color:#fcd34d; padding:12px; margin-bottom:12px;">

      <button class="btn btn-green" style="flex:1; justify-content:center;" onclick="hideModal('modalDeliveredSecret'); completeOrder('${order.id}', true);">✅ ยืนยันรับของ & รีวิว</button>
    </div>
  `;
  showModal('modalDeliveredSecret');
}

/* ==================== 2. หน้าแชทต่อรอง & แก้ราคา ==================== */
function renderChat() {
  const p = db.products.find(x => x.id === db.selectedProductId) || db.products[0];
  if (!p) return `<div class="box">ไม่มีสินค้า</div>`;

  return `
    ${renderBuyerCompactBar()}
    <div class="box">
      <div class="box-title">
        <span>💬 แชทต่อรองราคา</span>
        <select onchange="db.selectedProductId=this.value; saveDB(); render();" style="padding:5px 8px; border-radius:8px; border:1px solid var(--border);">
          ${db.products.map(item => `<option value="${item.id}" ${item.id===p.id?'selected':''}>${item.title} (${fmt(item.price)})</option>`).join('')}
        </select>
      </div>

      <div class="chat-box">
        <div class="chat-top">
          <div>
            <b>${p.title}</b> · <span style="color:var(--gold); font-weight:700;">${fmt(p.price)}</span>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            ${db.role === 'seller' ? `
              <input type="number" id="newPriceBox" value="${p.price}" style="width:100px; padding:5px 8px; border:1px solid var(--border); border-radius:8px;">
              <button class="btn btn-gold" onclick="sellerChangePrice('${p.id}')">✏️ แก้ราคา</button>
            ` : `
              <button class="btn btn-green" onclick="openCheckoutConfirm('${p.id}')">🛒 ซื้อราคานี้</button>
            `}
          </div>
        </div>

        <div class="chat-messages">
          ${db.messages.map(m => {
            if (m.sender === 'sys') return `<div class="msg sys">${m.text}</div>`;
            return `<div class="msg ${m.sender === 'buyer' ? 'me' : ''}"><small style="color:var(--muted);display:block;font-size:10px;">${m.author}</small>${m.text}</div>`;
          }).join('')}
        </div>

        <div class="chat-bar">
          <input type="number" id="offerPriceInput" placeholder="เสนอราคา (บาท)" style="max-width:150px; padding:7px; border:1px solid var(--border); border-radius:8px;">
          <input type="text" id="chatMsgInput" placeholder="พิมพ์ข้อความ..." style="flex:1; padding:7px; border:1px solid var(--border); border-radius:8px;">
          <button class="btn btn-gold" onclick="sendChat()">ส่ง</button>
        </div>
      </div>
    </div>
  `;
}

function sendChat() {
  const offer = Number(document.getElementById('offerPriceInput').value || 0);
  const txt = document.getElementById('chatMsgInput').value.trim();
  if (!offer && !txt) return;
  const isSeller = db.role === 'seller';
  db.messages.push({
    sender: isSeller ? 'seller' : 'buyer',
    author: isSeller ? db.currentSeller.shopName : db.buyer.name,
    text: offer > 0 ? `💰 เสนอราคา ${fmt(offer)} ${txt}` : txt
  });
  saveDB();
  render();
}

function sellerChangePrice(productId) {
  const val = Number(document.getElementById('newPriceBox').value || 0);
  if (val <= 0) return;
  const p = db.products.find(x => x.id === productId);
  if (!p) return;
  p.price = val;
  db.messages.push({ sender: 'sys', text: `✅ ผู้ขายปรับราคาเป็น ${fmt(val)} แล้ว` });
  saveDB();
  render();
}

function completeOrder(orderId, promptReview = false) {
  const idx = db.orders.findIndex(x => x.id === orderId);
  if (idx === -1) return;
  const o = db.orders[idx];
  db.orders.splice(idx, 1);

  db.admin.escrowHolding = Math.max(0, db.admin.escrowHolding - o.price);
  db.admin.totalRevenue5Percent += o.fee5;

  if (o.sellerId === db.currentSeller.id || o.sellerShop === db.currentSeller.shopName) {
    db.currentSeller.wallet += o.sellerNet95;
  }
  const apSeller = db.approvedSellers.find(s => s.id === o.sellerId || s.shopName === o.sellerShop);
  if (apSeller) apSeller.wallet += o.sellerNet95;

  const done = { ...o, completedAt: 'เมื่อสักครู่', reviewed: false };
  db.completedOrders.unshift(done);
  saveDB();
  render();
  if (promptReview) openWriteReviewModal(done.id);
}

function openWriteReviewModal(orderId) {
  const order = db.completedOrders.find(x => x.id === orderId);
  if (!order) return;
  document.getElementById('modalWriteReviewContent').innerHTML = `
    <h3 style="margin-bottom:8px;">⭐ รีวิวร้าน ${order.sellerShop}</h3>
    <div class="field">
      <label>คะแนน (1-5 ดาว)</label>

  `;

function submitOrderReview(orderId) {
  const order = db.completedOrders.find(x => x.id === orderId);
  if (!order) return;
  const rating = Number(document.getElementById('reviewRatingInput').value || 5);
  const comment = document.getElementById('reviewCommentInput').value.trim();
  order.reviewed = true;
  db.reviews.unshift({
    id: 'rev_' + Date.now(),
    orderId: order.id,
    sellerShop: order.sellerShop,
    buyerName: db.buyer.name,
    productTitle: order.title,
    rating,
    comment,
    createdAt: 'เมื่อสักครู่'
  });
  saveDB();
  hideModal('modalWriteReview');
  openShopProfile(order.sellerShop);
}

function saveTempSellerInputs() {
  const s = db.currentSeller;
  const shopEl = document.getElementById('sShop');
  if (!shopEl) return;
  s.shopName = shopEl.value.trim() || s.shopName;
  s.fullName = document.getElementById('sFullName').value.trim() || s.fullName;
  s.bankName = document.getElementById('sBankName').value.trim();
  s.bankNo = document.getElementById('sBankNo').value.trim();
}

function handleDocUpload(event, docKey) {
  saveTempSellerInputs();
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    db.currentSeller.docs[docKey] = { attached: true, fileName: file.name, dataUrl: e.target.result };
    db.currentSeller.stars = countSellerStars(db.currentSeller.docs);
    saveDB();
    render();
  };
  reader.readAsDataURL(file);
}

function submitSellerRegistration() {
  saveTempSellerInputs();
  if (!db.currentSeller.shopName || !db.currentSeller.fullName) {
    toast('กรุณากรอกชื่อร้านและชื่อ-นามสกุลจริง');
    return;
  }
  db.currentSeller.stars = countSellerStars(db.currentSeller.docs);
  db.currentSeller.status = 'pending';
  saveDB();
  render();
}

function sellerAddProduct() {
  const s = db.currentSeller;
  const deliveryType = document.getElementById('newPDeliveryType').value;
  const secretPayload = document.getElementById('newPSecret').value.trim();
  const title = document.getElementById('newPTitle').value.trim();
  const cat = document.getElementById('newPCat').value;
  const price = Number(document.getElementById('newPPrice').value || 0);
  const tInfo = DELIVERY_TYPES[deliveryType] || DELIVERY_TYPES.account;

  if (!secretPayload || !title || price <= 0) {
    toast('กรุณากรอกข้อมูลให้ครบถ้วน');
    return;
  }

  db.products.unshift({
    id: 'p' + Date.now(),
    sellerId: s.id,
    title,
    cat,
    deliveryType,
    secretPayload,
    price,
    icon: tInfo.icon,
    sellerShop: s.shopName,
    sellerOwner: s.fullName,
    sellerStars: s.stars || 3
  });

  saveDB();
  toast('ลงขายสินค้าเรียบร้อย');
  goPage('market');
}

function adminApproveSeller() {
  const s = db.currentSeller;
  s.status = 'approved';
  const idx = db.approvedSellers.findIndex(x => x.id === s.id || x.shopName === s.shopName);
  const copy = JSON.parse(JSON.stringify(s));
  if (idx >= 0) db.approvedSellers[idx] = copy;
  else db.approvedSellers.unshift(copy);
  saveDB();
  toast('อนุมัติร้านค้าเรียบร้อย');
  render();
}

function adminRejectSeller() {
  db.currentSeller.status = 'unregistered';
  saveDB();
  render();
}

function adminCancelProduct(productId) {
  db.products = db.products.filter(x => x.id !== productId);
  saveDB();
  toast('ยกเลิกสินค้าเรียบร้อย');
  render();
}

function refundOrder(orderId) {
  const idx = db.orders.findIndex(x => x.id === orderId);
  if (idx === -1) return;
  const o = db.orders[idx];
  db.orders.splice(idx, 1);
  db.admin.escrowHolding = Math.max(0, db.admin.escrowHolding - o.price);
  db.buyer.wallet += o.price;
  saveDB();
  render();
}

/* ==================== ล็อกอิน & เติมเงิน ==================== */
function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function hideModal(id) { document.getElementById(id).style.display = 'none'; }

function loginWithEmailPassword() {
  const name = document.getElementById('inputBuyerName').value.trim() || 'Non_Gamer_TH';
  const email = document.getElementById('inputGmail').value.trim();
  const pass = document.getElementById('inputPassword').value.trim();
  if (!email.includes('@') || pass.length < 4) {
    toast('กรุณากรอกอีเมลและรหัสผ่านให้ถูกต้อง');
    return;
  }
  db.buyer.name = name;
  db.buyer.email = email;
  hideModal('modalGmail');
  setRole('buyer');
}

function switchTopupMethod(method) {
  const isQR = method === 'qr';
  document.getElementById('topupTabQR').className = 'pay-option' + (isQR ? ' active' : '');
  document.getElementById('topupTabCard').className = 'pay-option' + (!isQR ? ' active' : '');
  document.getElementById('topupSectionQR').style.display = isQR ? 'block' : 'none';
  document.getElementById('topupSectionCard').style.display = !isQR ? 'block' : 'none';
}

function openQRModal() {
  showModal('modalQR');
  switchTopupMethod('qr');
  renderQRBox();
}

function setQRValue(v) {
  document.getElementById('qrAmount').value = v;
  renderQRBox();
}

function renderQRBox() {
  const amt = Math.max(1, Number(document.getElementById('qrAmount').value || 0));
  document.getElementById('qrTextAmt').textContent = fmt(amt);
  const wrap = document.getElementById('qrSvgWrap');
  if (typeof qrcode === 'function') {
    const qr = qrcode(0, 'M');
    qr.addData(`PROMPTPAY|MOBIUS_ESCROW|AMOUNT:${amt.toFixed(2)}`);
    qr.make();
    wrap.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
  }
}

function confirmQRTopup() {
  const amt = Number(document.getElementById('qrAmount').value || 0);
  if (amt <= 0) return;
  db.buyer.wallet += amt;
  saveDB();
  hideModal('modalQR');
  toast(`เติมเงิน ${fmt(amt)} สำเร็จ`);
  render();
}

render();
</script>
</body>
</html>
